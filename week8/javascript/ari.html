<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        let sum=a+b;
        let subtract=a-b;
        let multiply=a*b;
        let division=a/b;
        let power=a**b;
        let floordivision=Math.floor(a/b);
        console.log("sum =", sum);
        document.write("sum="+ sum +"<br>");
        document.write("subtract= "+ subtract +"<br>");
        document.write("multiply= "+ multiply +"<br>");
        document.write("division= "+ division +"<br>");
        document.write("power= "+ power +"<br>");
        document.write("floordivision= "+ floordivision);
    </script>
</body>
