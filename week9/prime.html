<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number=7;
        let count=0;
        for(let i=1;i<=number;i++){
            if(i%number==0)
            count++;
        }
        if(count==1){
            document.write("Prime Number");
        }
        else{
            document.write("Not a Prime");
        }
    </script>
</body>
</html>
